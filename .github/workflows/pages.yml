name: Public research docs

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'research/ideas/**/*.md'
      - 'src/**'
      - 'scripts/**'
      - 'configs/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install documentation renderer
        run: python -m pip install Markdown==3.9
      - name: Build public text and HTML
        run: >-
          python scripts/build_public_docs.py
          --base-url '${{ steps.pages.outputs.base_url }}'
      - name: Upload public documents only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish research documents
        id: deployment
        uses: actions/deploy-pages@v4
