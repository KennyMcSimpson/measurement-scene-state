name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONFAULTHANDLER: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Verify compressed reports
        run: python scripts/restore_report_artifacts.py --check
      - name: Lint owned code
        run: ruff check .
      - name: Run tests without downloaded data or weights
        run: pytest -q
