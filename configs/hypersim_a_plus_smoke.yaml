seed: 17
device: auto
dataset:
  name: hypersim
  root: data/hypersim_prepared/train/ai_001_001
  image_size: [32, 40]
  context_views: 2
  target_views: 1
  length: 1
  sample_stride: 100000
  spatial_protocol: context_local_metric
  local_bounds_m: [[-6.0, -4.0, 0.05], [6.0, 4.0, 12.05]]
model:
  mode: fixed
  voxel_resolution: [8, 8, 8]
  image_feature_dim: 8
  state_feature_dim: 8
  refinement_blocks: 0
  n_samples: 8
  ray_chunk_size: 512
training:
  output_dir: outputs/hypersim_a_plus_v2_cell_centered_smoke_bf16
  batch_size: 1
  learning_rate: 0.0002
  max_steps: 2
  num_workers: 0
  amp: true
  amp_dtype: bfloat16
  log_every: 1
  checkpoint_every: 1
  measurements: [rgb, depth, normal, point, visibility]
  weight_decay: 0.0001
  lr_schedule: warmup_cosine
  warmup_steps: 1
  min_lr_ratio: 0.1
  ema_decay: 0.98
