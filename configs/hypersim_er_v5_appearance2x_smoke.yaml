seed: 17
device: auto
dataset:
  name: hypersim
  root: data/hypersim_prepared/train/ai_001_001
  image_size: [32, 40]
  context_views: 4
  target_views: 2
  length: 1
  sample_stride: 100000
  spatial_protocol: context_local_metric
  local_bounds_m: [[-6.0, -4.0, 0.05], [6.0, 4.0, 12.05]]
model:
  mode: fixed
  state_architecture: evidence_residual
  voxel_resolution: [8, 8, 8]
  image_feature_dim: 8
  state_feature_dim: 8
  refinement_blocks: 1
  evidence_temperature: 0.1
  observed_residual_floor: 0.1
  completion_residual_scale: 4.0
  appearance_resolution_scale: 2
  n_samples: 8
  ray_chunk_size: 512
training:
  output_dir: outputs/hypersim_er_v5_appearance2x_smoke
  batch_size: 1
  learning_rate: 0.0002
  max_steps: 2
  num_workers: 0
  amp: true
  amp_dtype: bfloat16
  log_every: 1
  checkpoint_every: 1
  measurements: [rgb, depth, normal, point, visibility]
  weight_decay: 0.0001
  lr_schedule: warmup_cosine
  warmup_steps: 1
  min_lr_ratio: 0.1
  ema_decay: 0.98
  evidence_residual_weight: 0.001
