seed: 17
device: auto
dataset:
  name: hypersim
  root: data/hypersim_er_prepared/val
  image_size:
  - 128
  - 160
  context_views: 4
  target_views: 2
  length: 8
  sample_stride: 2
  spatial_protocol: context_local_metric
  local_bounds_m:
  - - -6.0
    - -4.0
    - 0.05
  - - 6.0
    - 4.0
    - 12.05
  scene_ids:
  - ai_052_007
  - ai_004_003
  - ai_016_004
  - ai_009_007
  - ai_053_003
  - ai_041_003
  - ai_031_010
  - ai_010_007
model:
  mode: fixed
  state_architecture: evidence_residual
  voxel_resolution:
  - 48
  - 32
  - 48
  image_feature_dim: 48
  state_feature_dim: 48
  refinement_blocks: 4
  evidence_temperature: 0.1
  observed_residual_floor: 0.1
  completion_residual_scale: 4.0
  appearance_resolution_scale: 2
  n_samples: 64
  ray_chunk_size: 4096
training:
  output_dir: outputs\hypersim_er_v6_phase0_v5_pilot_validation_v2
  batch_size: 1
  learning_rate: 0.0002
  max_steps: 1
  num_workers: 0
  amp: true
  amp_dtype: bfloat16
  log_every: 1
  checkpoint_every: 1
  measurements:
  - rgb
  - depth
  - normal
  - point
  - visibility
  evidence_residual_weight: 0.001
